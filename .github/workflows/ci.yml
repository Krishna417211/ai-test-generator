name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

# Least privilege by default. The deploy job widens this for itself, and only
# for the OIDC token it needs to assume the AWS role.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt ruff pytest-cov
      - name: Lint (ruff)
        run: ruff check .
      - name: Run tests with coverage
        run: pytest tests/ -v --cov=. --cov-report=term-missing

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Type-check & build
        run: npm run build

  # ── Deploy ────────────────────────────────────────────────────────────────
  # Only from master, only after both jobs above are green, and only on a push
  # (never on a pull_request — a fork's PR must not be able to reach AWS).
  deploy:
    name: Deploy to AWS
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    # Gives the repo a place to hold the role ARN and, if you want it, a
    # required-reviewer gate before anything reaches the box.
    environment: staging

    # Two deploys racing would leave the box on whichever image happened to
    # finish last. Queue them instead; never cancel one mid-roll.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    permissions:
      contents: read
      # Mints the OIDC token used to assume the AWS role. This is what lets the
      # pipeline hold no long-lived AWS keys at all.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Assume the deploy role (OIDC — no stored AWS keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          # Tagged with the commit SHA, never :latest — a box restarting must
          # come back on the exact build it was on.
          IMAGE="$REGISTRY/testra-backend:${{ github.sha }}"
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "BACKEND_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build and push the web image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/testra-web:${{ github.sha }}"
          # SITE_URL is inlined into the JS bundle by Vite, so it is a build
          # input, not a runtime one. Wrong value here ships a broken frontend.
          docker build \
            -f frontend/Dockerfile.prod \
            --build-arg VITE_API_URL="${{ vars.SITE_URL }}" \
            -t "$IMAGE" frontend
          docker push "$IMAGE"
          echo "WEB_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Roll the instance onto the new images
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          REGION: ${{ vars.AWS_REGION }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Runs on the instance. Secrets are NOT passed from here — the app
          # reads them from /var/data/testra.env, which only the box can see.
          REMOTE=$(cat <<REMOTE_EOF
          set -euo pipefail
          # 'set -e' aborts at the failing line and says nothing about the box,
          # and SSM truncation can eat the error itself — which is how a deploy
          # failed with its cause invisible, leaving only pull progress in the
          # log. Print the two things that actually diagnose it on the way out.
          trap 'echo "--- DEPLOY FAILED; state follows ---"; df -h / /var/data || true; docker ps -a || true' ERR
          cd /opt/testra
          # Match the compose file to the images being deployed.
          git fetch --depth 1 origin ${SHA}
          git checkout --force FETCH_HEAD
          aws ecr get-login-password --region ${REGION} \
            | docker login --username AWS --password-stdin ${REGISTRY}
          export BACKEND_IMAGE='${BACKEND_IMAGE}'
          export WEB_IMAGE='${WEB_IMAGE}'
          export SITE_ADDRESS='${SITE_ADDRESS}'
          # --profile zap brings up the OWASP ZAP sidecar that powers active
          # vulnerability scanning. Its memory is hard-capped in the compose file,
          # so if the instance is too small the kernel kills only that container —
          # the API and Caddy keep serving and the backend falls back to passive
          # scanning by itself. The pull tolerates failure so a slow or
          # unavailable ZAP image can never fail a release of the app itself.
          #
          # NOTE: no backticks anywhere in this heredoc. It is unquoted (so that
          # ${BACKEND_IMAGE} etc. interpolate), which means bash also treats
          # backticks as command substitution — a pair of them in a comment made
          # the shell try to run its contents and log a syntax error mid-deploy.
          # Reclaim space BEFORE pulling, not after. Images are tagged by commit
          # SHA, so every release leaves a full backend+web image set behind that
          # is never dangling — plain 'docker image prune -f' reclaims nothing and
          # the volume fills. -a drops every image no container references; the
          # live containers are still up at this point, so the running release is
          # never touched. Rollback images stay available in ECR to re-pull.
          docker image prune -af
          docker container prune -f
          docker builder prune -af || true
          df -h / /var/lib/docker /var/data || true
          # The prune above cannot touch images the *running* release still
          # references, so on a full disk it reclaims almost nothing (81MB on the
          # deploy that added Playwright, against a 420MB Chromium layer). Root is
          # 8G and the backend image now carries a browser, so old + new no longer
          # fit side by side and the pull dies with "no space left on device"
          # mid-layer — after the images are already built and pushed.
          #
          # Only when actually short of space, stop the stack first: that releases
          # the running images so -af can drop them, which is the only space left
          # to reclaim. Costs the pull's worth of downtime, so it is deliberately
          # NOT the default path — a box with room keeps the zero-downtime roll.
          # 'down' takes no -v and every mount here is a bind under /var/data, so
          # the database, certs and env file are untouched.
          # \$ throughout this block: the heredoc delimiter is unquoted so that
          # \${BACKEND_IMAGE} and friends interpolate here on the runner. An
          # unescaped \$(df ...) would therefore measure the RUNNER's disk and
          # bake that number into the remote script — the check would silently
          # describe the wrong machine. Escaped, it reaches the instance intact.
          # tr -dc keeps digits only. --output=avail is a GNU coreutils
          # extension: where it is missing the command fails and tail yields the
          # header, and a bare [ "Avail" -lt 3000 ] is a syntax error that
          # 'set -e' turns into a dead deploy. Stripping to digits and defaulting
          # to 0 makes an unreadable disk take the recovery path — slower, but it
          # completes, which is the right way to be wrong here.
          AVAIL_MB=\$(df --output=avail -m / 2>/dev/null | tail -1 | tr -dc '0-9' || true)
          echo "root volume free: \${AVAIL_MB:-unknown}MB"
          if [ "\${AVAIL_MB:-0}" -lt 3000 ]; then
            echo "under 3000MB — stopping the stack to reclaim its images"
            docker compose -f deploy/docker-compose.prod.yml --profile zap down --remove-orphans || true
            docker image prune -af || true
            df -h / || true
          fi
          # App first, sidecar second, and never the other way round. Bringing
          # the whole --profile zap set up in one command lets an optional
          # sidecar take the SITE with it: the previous deploy stopped the stack
          # to reclaim space, then died during a 1.2GB ZAP pull, and the site
          # stayed down. The backend degrades to passive scanning on its own, so
          # ZAP must never be able to hold the app hostage. Note the reclaim path
          # above makes this MORE likely, not less — pruning -af untags the ZAP
          # image too, so the recovery deploy is exactly the one that has to
          # re-pull it.
          #
          # --quiet-pull is load-bearing, not tidiness. SSM caps command output
          # and layer-by-layer progress runs to thousands of lines: it blew the
          # cap and truncated the log mid-pull, taking StandardErrorContent with
          # it, so the deploy failed with its own cause scrolled off. Quiet pulls
          # keep the buffer for the part someone has to read.
          docker compose -f deploy/docker-compose.prod.yml pull --quiet backend web || true
          docker compose -f deploy/docker-compose.prod.yml up -d --quiet-pull backend web
          echo "--- app containers ---"
          docker compose -f deploy/docker-compose.prod.yml ps --format '{{.Service}} {{.State}}' || true
          # Past this line the site is already serving; everything below is
          # best-effort and must not be able to fail the release.
          docker compose -f deploy/docker-compose.prod.yml --profile zap pull --quiet zap || true
          docker compose -f deploy/docker-compose.prod.yml --profile zap up -d --quiet-pull --remove-orphans zap || true
          docker image prune -f
          # Post-roll headroom check. A deploy that succeeds with the disk nearly
          # full is the next deploy's failure, and the log above is the only place
          # anyone would see it coming.
          AVAIL_AFTER=\$(df --output=avail -m / 2>/dev/null | tail -1 | tr -dc '0-9' || true)
          echo "root volume free after roll: \${AVAIL_AFTER:-unknown}MB"
          if [ "\${AVAIL_AFTER:-0}" -lt 1500 ]; then
            echo "WARNING: under 1500MB free — grow the root volume or move"
            echo "docker's data-root onto /var/data before the next release."
          fi
          # The pull above is deliberately '|| true' so a bad ZAP image can never
          # fail a release — but that also means "the sidecar silently never came
          # up" looks exactly like a green deploy, which is how active scanning
          # stayed broken without anyone being told. Print its state so the answer
          # is in the deploy log instead of only in a scan that quietly went
          # passive. Informational only: still never fails the release.
          echo "--- zap sidecar ---"
          docker compose -f deploy/docker-compose.prod.yml --profile zap ps zap || true
          docker inspect --format 'zap OOMKilled={{.State.OOMKilled}} restarts={{.RestartCount}}' testra-zap-1 || true
          free -m || true
          REMOTE_EOF
          )

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${SHA:0:7}" \
            --parameters "$(jq -n --arg c "$REMOTE" '{commands: [$c]}')" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          # Not `aws ssm wait`: its 100s ceiling is shorter than an image pull.
          STATUS=Pending
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          echo "--- remote stdout ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text || true
          echo "--- remote stderr ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text || true

          [ "$STATUS" = "Success" ] || { echo "Deploy command ended as: $STATUS"; exit 1; }

      - name: Verify the site actually answers
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          # A green SSM command only means the containers started. This is the
          # step that notices the app came up broken.
          for _ in $(seq 1 30); do
            CODE=$(curl -fsS -o /dev/null -w '%{http_code}' "$SITE_URL/health" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "Healthy: $SITE_URL/health -> 200"
              exit 0
            fi
            sleep 5
          done
          echo "$SITE_URL/health never returned 200 — the new images are live and failing."
          echo "There is no automatic rollback: redeploy the previous good SHA from the Actions tab."
          exit 1
