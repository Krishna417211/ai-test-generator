# Production stack for the single EC2 instance. Two containers: the API, and
# Caddy serving the SPA + terminating TLS.
#
# This file is never run by hand — .github/workflows/ci.yml sets the image tags
# and runs it over SSM. `docker compose -f deploy/docker-compose.prod.yml up`
# with no environment will refuse to start rather than guess (see the :? below).
#
# The dev stack is docker-compose.yml at the repo root; it bind-mounts source
# and runs reload servers. Don't point that one at a real box.

name: testra

services:
  backend:
    # Pinned by CI to a specific commit SHA, never :latest — a restart must
    # bring back the exact build that was running, not whatever moved since.
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set (CI sets it to the ECR tag)}
    restart: unless-stopped

    # Secrets live on the instance, not in this file, not in the image, and not
    # in GitHub. Created once by hand at bootstrap; see docs/DEPLOY.md.
    env_file:
      - /var/data/testra.env

    environment:
      APP_ENV: production
      # The whole point of the EBS volume. The image's filesystem is replaced on
      # every deploy; /data is not. If this ever pointed back inside the
      # container, every account and paid plan would vanish on the next release.
      TESTGEN_DB: /data/testgen.db
      # Active vulnerability scanning talks to the ZAP sidecar over the internal
      # compose network (never exposed to the internet). If the sidecar isn't
      # running — not started, still booting, or OOM-killed — the backend simply
      # reports active scanning unavailable and falls back to the passive audit,
      # so neither value here can break a deploy or a request.
      ZAP_ADDRESS: http://zap:8090
      ZAP_ALLOW_ACTIVE: "true"
      # MUST be the same expression as the zap service's api.key below. Both are
      # interpolated from the same variable with the same default, so the two
      # containers always agree.
      #
      # This is the bug that made active scanning report itself unavailable in
      # production: ZAP booted requiring the default key, the backend was given
      # no key at all, so every call was rejected, available() returned False and
      # the scan silently fell back to the passive audit. Setting one side without
      # the other is the failure mode — keep them together.
      ZAP_API_KEY: ${ZAP_API_KEY:-testra-internal-zap}

    volumes:
      - /var/data/db:/data

    # Deliberately NOT depends_on: zap — the daemon is optional and profile-gated,
    # and the API must never wait on (or be blocked by) a feature that may not be
    # running. It degrades to passive scanning on its own when ZAP is absent.

    # No ports: — the API is only reachable through Caddy, so the instance never
    # exposes an unencrypted 8000 to the internet.
    expose:
      - "8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be set (CI sets it to the ECR tag)}
    restart: unless-stopped

    environment:
      # A bare ":80" for staging on an IP; a hostname switches Caddy into
      # automatic HTTPS. See frontend/Caddyfile.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Issued certificates and Caddy's ACME account key. On the volume because
      # losing them on every deploy means re-requesting certs and eventually
      # tripping Let's Encrypt rate limits.
      - /var/data/caddy:/data
      - /var/data/caddy-config:/config

    depends_on:
      - backend

  # OWASP ZAP daemon — the engine behind active vulnerability scanning. Only the
  # backend talks to it (no ports: — never reachable from the internet), and it
  # only ever runs a scan when a request is both authorized and enabled server-side.
  #
  # Started by CI with `--profile zap` (see ci.yml). It stays behind a profile so
  # the file can still be run by hand without it, and so it can be switched off by
  # dropping one flag rather than editing services.
  #
  # MEMORY IS CAPPED ON PURPOSE. ZAP is a JVM app that will happily grow until the
  # box dies, and this instance also runs the API and Caddy. mem_limit is a hard
  # ceiling the kernel enforces: if ZAP exceeds it, Docker OOM-kills *only this
  # container*, the site stays up, and the backend degrades to passive scanning on
  # its own. -Xmx keeps the JVM under that ceiling so it normally never gets there.
  # This is what makes enabling active scanning safe without knowing the instance
  # size in advance.
  #
  # The api.key below and the backend's ZAP_API_KEY above are the *same*
  # interpolation with the *same* default, which is what guarantees the two
  # containers agree. Change one and you must change the other.
  #
  # Note there is deliberately no env_file here. ZAP needs one secret — its own
  # API key — and giving a third-party image the file holding our LLM keys, SMTP
  # password and session secret buys nothing: it reads the key from the command
  # line, and anything else in that file would only widen what a compromised
  # scanner container could reach.
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    restart: unless-stopped
    profiles: ["zap"]
    environment:
      JAVA_OPTS: "-Xmx512m"
      # Only so the healthcheck below can quote it without repeating the
      # interpolation a third time.
      ZAP_KEY: ${ZAP_API_KEY:-testra-internal-zap}
    mem_limit: 1g
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.key=${ZAP_API_KEY:-testra-internal-zap}
      -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    expose:
      - "8090"

    # ZAP takes about a minute to answer after a start, and it is memory-capped
    # above — so "did it come up, and is it still up?" is a question an operator
    # will actually need answered. With this, `docker compose ps` says
    # healthy/unhealthy instead of just "running", and an OOM-restart loop is
    # visible at a glance rather than only as scans quietly going passive.
    # python3 rather than curl: the ZAP image ships its own python tooling
    # (zap-baseline.py and friends), so it is certain to be there, while curl is
    # not something to bet a health signal on.
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import os,urllib.request; urllib.request.urlopen('http://localhost:8090/JSON/core/view/version/?apikey='+os.environ.get('ZAP_KEY','')).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
